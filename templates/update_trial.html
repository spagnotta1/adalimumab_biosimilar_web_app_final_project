<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Trial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Update Trial</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label for="ndc_code" class="form-label">NDC Code</label>
                <input type="text" class="form-control" id="ndc_code" name="ndc_code" value="{{ trial.ndc_code }}" readonly>
            </div>
            <div class="mb-3">
                <label for="drug_name" class="form-label">Brand Name</label>
                <input type="text" class="form-control" id="drug_name" name="drug_name" value="{{ trial.drug_name }}" required>
            </div>
            <div class="mb-3">
                <label for="active_ingredients" class="form-label">Molecular Name</label>
                <input type="text" class="form-control" id="active_ingredients" name="active_ingredients" value="{{ trial.active_ingredients }}">
            </div>
            <div class="mb-3">
                <label for="strength" class="form-label">Strength</label>
                <input type="text" class="form-control" id="strength" name="strength" value="{{ trial.strength }}">
            </div>
            <div class="mb-3">
                <label for="labeler_name" class="form-label">Manufacturer</label>
                <input type="text" class="form-control" id="labeler_name" name="labeler_name" value="{{ trial.labeler_name }}">
            </div>
            <div class="mb-3">
                <label for="action_type" class="form-label">Status</label>
                <input type="text" class="form-control" id="action_type" name="action_type" value="{{ trial.action_type }}">
            </div>
            <div class="mb-3">
                <label for="action_date" class="form-label">Clinical Trial End Date (MM/DD/YYYY)</label>
                <input type="text" class="form-control" id="action_date" name="action_date" value="{{ trial.action_date }}">
            </div>
            <div class="mb-3">
                <label for="marketing_start_date" class="form-label">Brand Launch Date (MM/DD/YYYY)</label>
                <input type="text" class="form-control" id="marketing_start_date" name="marketing_start_date" value="{{ trial.marketing_start_date }}">
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
