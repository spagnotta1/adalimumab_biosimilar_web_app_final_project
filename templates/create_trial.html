<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Trial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Create New Trial</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label for="ndc_code" class="form-label">NDC Code</label>
                <input type="text" class="form-control" id="ndc_code" name="ndc_code" required>
            </div>
            <div class="mb-3">
                <label for="drug_name" class="form-label">Brand Name</label>
                <input type="text" class="form-control" id="drug_name" name="drug_name" required>
            </div>
            <div class="mb-3">
                <label for="active_ingredients" class="form-label">Molecular Name</label>
                <input type="text" class="form-control" id="active_ingredients" name="active_ingredients">
            </div>
            <div class="mb-3">
                <label for="strength" class="form-label">Strength</label>
                <input type="text" class="form-control" id="strength" name="strength">
            </div>
            <div class="mb-3">
                <label for="dosage" class="form-label">Dosage</label>
                <input type="text" class="form-control" id="dosage" name="dosage">
            </div>
            <div class="mb-3">
                <label for="route" class="form-label">Route</label>
                <input type="text" class="form-control" id="route" name="route">
            </div>
            <div class="mb-3">
                <label for="mrkt_status" class="form-label">Market Status</label>
                <input type="text" class="form-control" id="mrkt_status" name="mrkt_status">
            </div>
            <div class="mb-3">
                <label for="te_code" class="form-label">TE Code</label>
                <input type="text" class="form-control" id="te_code" name="te_code">
            </div>
            <div class="mb-3">
                <label for="rld" class="form-label">RLD</label>
                <input type="text" class="form-control" id="rld" name="rld">
            </div>
            <div class="mb-3">
                <label for="rs" class="form-label">RS</label>
                <input type="text" class="form-control" id="rs" name="rs">
            </div>
            <div class="mb-3">
                <label for="submission" class="form-label">Submission</label>
                <input type="text" class="form-control" id="submission" name="submission">
            </div>
            <div class="mb-3">
                <label for="labeler_name" class="form-label">Manufacturer</label>
                <input type="text" class="form-control" id="labeler_name" name="labeler_name">
            </div>
            <div class="mb-3">
                <label for="action_type" class="form-label">Status</label>
                <input type="text" class="form-control" id="action_type" name="action_type">
            </div>
            <div class="mb-3">
                <label for="action_date" class="form-label">Clinical Trial End Date (MM/DD/YYYY)</label>
                <input type="text" class="form-control" id="action_date" name="action_date">
            </div>
            <div class="mb-3">
                <label for="marketing_start_date" class="form-label">Brand Launch Date (MM/DD/YYYY)</label>
                <input type="text" class="form-control" id="marketing_start_date" name="marketing_start_date">
            </div>
            <button type="submit" class="btn btn-primary">Create</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
